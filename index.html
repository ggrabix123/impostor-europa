<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>WebRTC P2P Direct Connection</title>
</head>
<body>
    <h2>WebRTC Connection Test</h2>
    <div id="status">Inicjalizacja...</div>

    <script>
        // Konfiguracja WebRTC z darmowymi serwerami STUN i TURN (OpenRelay)
        // Działa w sieciach komórkowych (LTE/5G/Hotspot) bez modyfikacji zapory
        const rtcConfiguration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                {
                    urls: [
                        'turn:openrelay.metered.ca:80',
                        'turn:openrelay.metered.ca:443',
                        'turn:openrelay.metered.ca:443?transport=tcp'
                    ],
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ],
            iceTransportPolicy: 'all'
        };

        const peerConnection = new RTCPeerConnection(rtcConfiguration);

        // Monitorowanie zmian stanu połączenia ICE
        peerConnection.oniceconnectionstatechange = () => {
            const state = peerConnection.iceConnectionState;
            console.log(`[${new Date().toLocaleTimeString()}] ICE State:`, state);
            document.getElementById('status').innerText = `Stan połączenia: ${state}`;

            if (state === 'connected' || state === 'completed') {
                console.log('Połączenie nawiązane pomyślnie!');
            } else if (state === 'failed' || state === 'disconnected') {
                console.warn('Połączenie przerwane. Reorganizacja kanału...');
            }
        };

        // Tworzenie DataChannel dla przesyłania danych
        const dataChannel = peerConnection.createDataChannel("chat");
        dataChannel.onopen = () => console.log("Kanał danych otwarty!");
        dataChannel.onmessage = (event) => console.log("Odebrano wiadomość:", event.data);

        // Generowanie kandydatów ICE
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                // Wyślij ten obiekt 'candidate' przez swój serwer sygnalizacyjny (np. WebSocket) do drugiego urządzenia
                console.log("Wygenerowano kandydata ICE:", JSON.stringify(event.candidate));
            }
        };

        // Przykład inicjalizacji połączenia (Host)
        async function startAsHost() {
            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                // Wyślij 'offer' przez serwer sygnalizacyjny
                console.log("Utworzono Offer:", JSON.stringify(offer));
            } catch (error) {
                console.error("Błąd podczas tworzenia offer:", error);
            }
        }

        // Wywołanie startowe
        startAsHost();
    </script>
</body>
</html>
