<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC P2P (Komputer - Telefon)</title>
    <!-- Biblioteka PeerJS do automatycznej sygnalizacji -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 450px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .box { background: #f8f9fa; padding: 10px; border-radius: 4px; margin-bottom: 12px; word-break: break-all; }
        #status { font-weight: bold; color: #dc3545; }
        #status.online { color: #28a745; }
        #chat { height: 160px; overflow-y: auto; border: 1px solid #ddd; padding: 8px; background: #fff; margin-bottom: 10px; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <h2>Połączenie WebRTC P2P</h2>
    
    <div class="box">
        <strong>ID Twojego urządzenia:</strong>
        <div id="my-id">Łączenie z chmurą...</div>
    </div>

    <div class="box">
        <strong>Stan:</strong> <span id="status">Rozłączony</span>
    </div>

    <hr>

    <h3>1. Połącz urządzenia</h3>
    <input type="text" id="remote-id" placeholder="Wklej ID drugiego urządzenia">
    <button onclick="connectToPeer()">Połącz</button>

    <hr>

    <h3>2. Test przesyłania danych</h3>
    <div id="chat"></div>
    <input type="text" id="message-input" placeholder="Wpisz wiadomość...">
    <button onclick="sendMessage()">Wyślij wiadomość</button>

    <script>
        let peer = null;
        let conn = null;

        // Pełna konfiguracja STUN/TURN omijająca blokady Hotspotów komórkowych
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    {
                        urls: [
                            'turn:openrelay.metered.ca:80',
                            'turn:openrelay.metered.ca:443',
                            'turn:openrelay.metered.ca:443?transport=tcp'
                        ],
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ]
            }
        };

        function initPeer() {
            peer = new Peer(peerConfig);

            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = id;
            });

            // Reakcja na połączenie przychodzące (Host)
            peer.on('connection', (connection) => {
                conn = connection;
                bindEvents();
            });

            peer.on('error', (err) => {
                logMessage('❌ Błąd sieci: ' + err.type);
            });
        }

        function connectToPeer() {
            const remoteId = document.getElementById('remote-id').value.trim();
            if (!remoteId) {
                alert('Wklej ID drugiego urządzenia!');
                return;
            }

            logMessage('Łączenie z urządzeniem: ' + remoteId);
            conn = peer.connect(remoteId);
            bindEvents();
        }

        function bindEvents() {
            conn.on('open', () => {
                const statusEl = document.getElementById('status');
                statusEl.innerText = 'POŁĄCZONO';
                statusEl.className = 'online';
                logMessage('✅ Sukces! Kanał P2P otwarto.');
            });

            conn.on('data', (data) => {
                logMessage('Odebrano: ' + data);
            });

            conn.on('close', () => {
                const statusEl = document.getElementById('status');
                statusEl.innerText = 'Rozłączono';
                statusEl.className = '';
                logMessage('⚠️ Połączenie zamknięte.');
            });
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const msg = input.value;
            if (conn && conn.open) {
                conn.send(msg);
                logMessage('Wysłąno: ' + msg);
                input.value = '';
            } else {
                alert('Najpierw nawiąż połączenie!');
            }
        }

        function logMessage(msg) {
            const chat = document.getElementById('chat');
            chat.innerHTML += '<div>' + msg + '</div>';
            chat.scrollTop = chat.scrollHeight;
        }

        initPeer();
    </script>
</body>
</html>
